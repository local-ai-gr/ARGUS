services:
  detector:
    build: .
    image: argus-tree-detector
    # Remove the 'deploy' block to run on CPU only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./input:/data/input:ro
      - ./output:/data/output
    command: ["--input", "/data/input", "--output", "/data/output"]
